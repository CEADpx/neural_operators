# Create environment `neuralopv2` using:
#   conda env create -f neuralop.yml
name: neuralopv2
channels:
  - conda-forge
dependencies:
  - python=3.12
  - fenics-dolfinx
  - mpich
  - matplotlib
  - scipy
  - jupyter
  - jupyterlab>=3
  - ipywidgets
  - pip
  - pip:
    - torch
    - seaborn
    - meshio
    - pympler
    - h5py
    - pygmsh
    - pyvista[all,trame]
variables:
  # PyTorch + conda OpenMP on macOS (avoid kernel abort in NN notebooks)
  KMP_DUPLICATE_LIB_OK: "TRUE"
